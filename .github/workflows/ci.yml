name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default. No job here writes anything.
permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Style wiring
            run: composer style:verify
          - name: Formatting
            run: composer fmt:test
          - name: Static analysis
            run: composer analyze:ci
          - name: Rector
            run: composer rector:ci
          - name: Dependency audit
            run: composer audit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Generated rather than committed, so no application key lives in a public repository.
      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run the test suite
        run: composer test:ci

  pinned-actions:
    name: Actions are pinned to commit SHAs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag is mutable: whoever controls the action's repository can move it to different code, and
      # that code runs with this repository's token.
      - name: Check every `uses:` is a 40-character SHA
        run: |
          status=0

          while IFS= read -r line; do
            reference="${line#*uses:}"
            reference="$(printf '%s' "${reference}" | tr -d ' ' | cut -d'#' -f1)"

            case "${reference}" in
              ./*|docker://*) continue ;;
            esac

            version="${reference##*@}"

            if ! printf '%s' "${version}" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::unpinned action: ${reference}"
              status=1
            fi
          done < <(grep -rhE '^\s*-?\s*uses:' .github/workflows/)

          if [ "${status}" -eq 0 ]; then
            echo "All actions are pinned to commit SHAs"
          fi

          exit "${status}"
